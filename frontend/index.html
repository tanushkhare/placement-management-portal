<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Placement Management Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: white; padding: 30px; max-width: 600px; margin: auto; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #007acc; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
        .card { background: #2d2d2d; padding: 15px; margin-top: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <h2>Placement Management Portal</h2>
    <div class="card">
        <h3>Submit Application</h3>
        <input type="text" id="student_name" placeholder="Student Name">
        <input type="text" id="company_name" placeholder="Company Name">
        <input type="text" id="role" placeholder="Role (e.g. Software Engineer)">
        <input type="number" step="0.01" id="cgpa" placeholder="CGPA">
        <button onclick="submitApplication()">Submit Application</button>
    </div>

    <div class="card">
        <h3>Submitted Applications</h3>
        <div id="applications_list">Loading...</div>
    </div>

    <script>
        async function fetchApplications() {
            const res = await fetch("http://127.0.0.1:8000/api/applications");
            const data = await res.json();
            const listDiv = document.getElementById("applications_list");
            if (data.length === 0) {
                listDiv.innerHTML = "<p>No applications submitted yet.</p>";
                return;
            }
            listDiv.innerHTML = data.map(app => `
                <div style="border-bottom: 1px solid #444; padding: 8px 0;">
                    <strong>${app.student_name}</strong> - ${app.company_name} (${app.role}) | CGPA: ${app.cgpa}
                </div>
            `).join('');
        }

        async function submitApplication() {
            const payload = {
                student_name: document.getElementById("student_name").value,
                company_name: document.getElementById("company_name").value,
                role: document.getElementById("role").value,
                cgpa: parseFloat(document.getElementById("cgpa").value)
            };

            const res = await fetch("http://127.0.0.1:8000/api/applications", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Application submitted successfully!");
                fetchApplications();
            } else {
                alert("Error submitting application.");
            }
        }

        fetchApplications();
    </script>
</body>
</html>
